[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-source-mcp"
version = "0.1.0"
description = "Read-only Odoo source navigation for MCP clients"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2"]

[project.scripts]
odoo-source-mcp = "odoo_source_mcp.server:main"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_source_mcp"]
